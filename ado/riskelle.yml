# riskelle for Azure DevOps: a job template that scores each pull request,
# posts the band as the PR status riskelle/score and keeps one summary comment
# up to date. Adoption and what it posts: README.md, "Azure DevOps".
# Parameters: version (required, a vX.Y.Z tag, v0.19.0 or later); pool (a
# Linux amd64/arm64 agent with bash, git, curl, jq, tar, sha256sum);
# repository (where releases are read from, <repository>/releases/download/
# <version>/, for a mirror). riskelle is installed by that release's own
# install.sh, as a developer installs it; no token is needed to download it.
# The build service needs "Contribute to pull requests" to post. The scripts
# read only environment variables, never pipeline macros, so they run
# unchanged outside a pipeline.

parameters:
  - name: version
    type: string
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: repository
    type: string
    default: https://github.com/bobmcallan/riskelle

jobs:
  - job: riskelle
    displayName: riskelle score
    pool: ${{ parameters.pool }}
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: false

      - bash: |
          # riskelle: install
          set -euo pipefail
          if [[ ! $RISKELLE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "riskelle: version '$RISKELLE_VERSION' is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          dir="$AGENT_TEMPDIRECTORY/riskelle-$RISKELLE_VERSION"
          rm -rf "$dir"
          mkdir -p "$dir"
          if ! curl -fsSL -o "$dir/install.sh" "$RISKELLE_REPO_URL/releases/download/$RISKELLE_VERSION/install.sh"; then
            echo "riskelle: $RISKELLE_VERSION has no install.sh release asset; the template installs v0.19.0 or later" >&2
            exit 1
          fi
          RISKELLE_INSTALL_DIR="$dir/bin" sh "$dir/install.sh"
          echo "##vso[task.prependpath]$dir/bin"
        displayName: Install riskelle ${{ parameters.version }}
        env:
          RISKELLE_VERSION: ${{ parameters.version }}
          RISKELLE_REPO_URL: ${{ parameters.repository }}

      - bash: |
          # riskelle: score and publish
          set -euo pipefail
          pr="${SYSTEM_COLLECTIONURI%/}/$SYSTEM_TEAMPROJECTID/_apis/git/repositories/$BUILD_REPOSITORY_ID/pullRequests/$SYSTEM_PULLREQUEST_PULLREQUESTID"
          api="api-version=7.0"
          out="$AGENT_TEMPDIRECTORY/riskelle"
          mkdir -p "$out"
          # ado METHOD URL [BODY_FILE]: one REST call, its response in
          # $out/response.json; any answer but 2xx fails it.
          ado() {
            local code
            code=$(curl -sS -X "$1" -o "$out/response.json" -w '%{http_code}' \
              -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -H "Content-Type: application/json" \
              ${3:+--data-binary "@$3"} "$2")
            [[ $code == 2?? ]] && return 0
            echo "riskelle: $1 $2 answered $code; on 401 or 403, grant the build service 'Contribute to pull requests' on the repository" >&2
            return 1
          }
          status() {
            jq -n --arg state "$1" --arg description "$2" \
              --arg url "${SYSTEM_COLLECTIONURI%/}/$SYSTEM_TEAMPROJECTID/_build/results?buildId=$BUILD_BUILDID" \
              '{state: $state, description: $description, context: {genre: "riskelle", name: "score"}, targetUrl: $url}' \
              > "$out/status.json"
            ado POST "$pr/statuses?$api" "$out/status.json"
          }
          # The PR's own head against its target's tip, the refs a developer
          # scores locally; not the merge commit ADO checks out.
          base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          head="$SYSTEM_PULLREQUEST_SOURCECOMMITID"
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null ||
            ! git rev-parse --verify --quiet "$head^{commit}" > /dev/null ||
            ! riskelle score --base "$base" --head "$head" > "$out/riskelle.risk-report.json" ||
            ! riskelle score --format markdown --base "$base" --head "$head" > "$out/comment.md"; then
            echo "riskelle: could not score $base..$head; both must be in the checkout (fetchDepth: 0)" >&2
            status error "riskelle could not score this change" || true
            exit 1
          fi
          echo "##vso[artifact.upload artifactname=riskelle]$out/riskelle.risk-report.json"
          band=$(jq -r '"\(.level), \(.total)/100"' "$out/riskelle.risk-report.json")
          status succeeded "$band"
          # One summary thread, found by its property: the lowest live id.
          ado GET "$pr/threads?$api"
          found=$(jq -r '[.value[] | select((.isDeleted | not) and .properties["riskelle.summary"] != null)]
            | sort_by(.id) | first | if . == null then "" else "\(.id) \([.comments[].id] | min)" end' "$out/response.json")
          if [[ -n $found ]]; then
            read -r thread comment <<< "$found"
            jq -n --rawfile content "$out/comment.md" '{content: $content}' > "$out/body.json"
            ado PATCH "$pr/threads/$thread/comments/$comment?$api" "$out/body.json"
          else
            jq -n --rawfile content "$out/comment.md" \
              '{comments: [{parentCommentId: 0, content: $content, commentType: "text"}], status: "closed",
                properties: {"riskelle.summary": {"$type": "System.String", "$value": "1"}}}' > "$out/body.json"
            ado POST "$pr/threads?$api" "$out/body.json"
          fi
          echo "riskelle: $band"
        displayName: Score and publish
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
