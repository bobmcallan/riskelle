name: riskelle
description: Score a pull request with a released riskelle, installed by that release's install.sh, post a riskelle status carrying the band, and keep one summary comment up to date.

inputs:
  version:
    description: The riskelle release to score with, latest (the default, the latest release as curl | sh installs it) or a vX.Y.Z tag, v0.19.0 or later (the first release with install.sh), to pin the scale.
    default: latest
  token:
    description: Token that posts the status and the comment (statuses write, pull-requests write).
    default: ${{ github.token }}
  repository:
    description: The repository riskelle releases are read from, for a mirror; its releases/download/<version>/ holds install.sh.
    default: https://github.com/bobmcallan/riskelle

outputs:
  total:
    description: The score, 0 to 100.
    value: ${{ steps.score.outputs.total }}
  level:
    description: The band, Low, Medium or High.
    value: ${{ steps.score.outputs.level }}

runs:
  using: composite
  steps:
    - name: install riskelle
      shell: bash
      env:
        RISKELLE_VERSION: ${{ inputs.version }}
        RISKELLE_REPO_URL: ${{ inputs.repository }}
      run: |
        # riskelle: install
        set -euo pipefail
        version=$RISKELLE_VERSION
        if [[ $version == latest ]]; then
          src="$RISKELLE_REPO_URL/releases/latest/download"
          unset RISKELLE_VERSION # install.sh resolves the latest tag, as curl | sh does
        elif [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          src="$RISKELLE_REPO_URL/releases/download/$version"
        else
          echo "::error::version '$version' is neither latest nor a vX.Y.Z tag"; exit 1
        fi
        [[ $RUNNER_OS == Linux ]] || { echo "::error::riskelle's action runs on Linux runners, not $RUNNER_OS"; exit 1; }
        dir="$RUNNER_TEMP/riskelle"
        rm -rf "$dir" && mkdir -p "$dir"
        curl -fsSL -o "$dir/install.sh" "$src/install.sh" ||
          { echo "::error::riskelle $version has no install.sh release asset; the action installs v0.19.0 or later"; exit 1; }
        RISKELLE_INSTALL_DIR="$dir/bin" sh "$dir/install.sh"
        echo "$dir/bin" >>"$GITHUB_PATH"
    - name: score and post
      id: score
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: '"$GITHUB_ACTION_PATH/scripts/github-pr.sh"'
