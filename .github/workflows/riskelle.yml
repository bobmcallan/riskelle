name: riskelle

# riskelle scores every pull request with the latest released binary: a
# "riskelle" status carrying the band, and one summary comment kept up to date.
# Adopters copy this file, replacing `uses: ./` with
# `uses: bobmcallan/riskelle@<tag>`, and may set the action's version input to
# a vX.Y.Z tag to pin the scale (README.md, GitHub pull requests).
on:
  pull_request: {}

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: riskelle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  riskelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
