# A container: its children carry the work. It may not close while a child is
# open; that rule is the children-closed check.
name = "epic"

[states.backlog]
start = true

[states.underway]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.children-closed]
skill = "riskelle-children-closed-check"

[gates.blocked-review]
skill = "riskelle-blocked-review"
agent = "reviewer-alt"

[gates.cancel-review]
skill = "riskelle-cancel-review"
agent = "reviewer-alt"

[[transition]]
from = ["backlog"]
to = "underway"

[[transition]]
from = ["underway"]
to = "done"
groups = [{ mode = "sequential", gates = ["children-closed"] }]

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["children-closed", "cancel-review"] }]
