[meta]
name = "done"
type = "workflow"
scope = "project"
create_review = "satelle-story-create-review"
amend_review = "satelle-story-amend-review"
description = "riskelle's overlay on the shipped declaration of done. An engineering story is planned, coded, integration-tested, merged to main and released before it closes; each story is worked on its own branch in its own worktree. Substrate closes without merge or release (.satelle is gitignored, so there is nothing to ship). Categories not named here (docs, epic-parent, parent, execution, task) stay on the shipped route. Half of a derived route; step.toml is the other half."

["*"]
obligations = ["raised", "planned", "coded", "integrated", "landed", "released", "closed"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [
  { step = "in_progress", from = ["integration", "merge", "release"] },
  { step = "backlog", from = ["plan"] },
]

[substrate]
obligations = ["raised", "authored", "substrate-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
