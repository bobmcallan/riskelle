# A chore: code without a plan stage, end DEV at approved (an open pull
# request), and reach done only through a run of the release task, as a
# delivery story does.
name = "chore"

[states.backlog]
start = true

[states.in_progress]
performer = { agent = "executor", skill = "coder" }

[states.integration]

# DEV ends here; a run of the release task takes the item.
[states.approved]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.format-vet]
skill = "riskelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "riskelle-build-unit-check"
carry = true

[gates.code-review]
skill = "riskelle-code-review"
agent = "reviewer-alt"
carry = true

[gates.integration-check]
skill = "riskelle-integration-check"

[gates.pr-ready]
skill = "riskelle-pr-ready-check"

[gates.risk]
skill = "riskelle-risk-check"

[gates.release-run]
skill = "riskelle-release-run-check"

[gates.release-published]
skill = "riskelle-release-published-check"

[gates.release-installed]
skill = "riskelle-release-installed-check"

[gates.blocked-review]
skill = "riskelle-blocked-review"
agent = "reviewer-alt"

[gates.cancel-review]
skill = "riskelle-cancel-review"
agent = "reviewer-alt"

[[transition]]
from = ["backlog"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["format-vet", "build-unit"] },
  { mode = "sequential", gates = ["code-review"] },
]

[[transition]]
from = ["integration"]
to = "approved"
groups = [{ mode = "sequential", gates = ["integration-check", "pr-ready", "risk"] }]

[[transition]]
from = ["approved"]
to = "done"
groups = [{ mode = "sequential", gates = ["release-run", "release-published", "release-installed"] }]

[[transition]]
from = ["integration", "approved"]
to = "in_progress"

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
