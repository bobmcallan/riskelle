# This repo's agent bindings. A workflow names which binding performs a state
# or judges a gate. A judge's grant must be read-only and its adapter must
# enforce grants. Modelled on orbelle/satelle's bindings.

# The interactive session codes and runs tasks; nothing is dispatched.
[agents.executor]
command = "session"

# Dispatched planner: Opus 5.5 on Cursor's own CLI (effort lives in the model
# id). A read-only grant runs ask mode with every shell command denied;
# satelle attaches the `plan` artifact it hands back.
[agents.planner]
command = "cursor-agent"
model = "claude-opus-5-5-medium"
tools = ["Read", "Grep", "Glob"]

# The gates' judge: Gemini 3.8 flash on Cursor's own CLI (effort lives in the
# model id; read-only grant runs ask mode with every shell command denied).
[agents.reviewer-alt]
command = "cursor-agent"
model = "gemini-3.8-flash-low"
tools = ["Read", "Grep", "Glob"]

# Second plan judge: Grok 4.7 on Cursor's own CLI (effort in the model id);
# both must accept a plan. Every dispatched step runs on cursor-agent, and the
# judges stay in other families than the planner.
[agents.reviewer-grok]
command = "cursor-agent"
model = "grok-4.7-medium"
tools = ["Read", "Grep", "Glob"]
