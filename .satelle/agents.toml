# This repo's agent bindings. A workflow names which binding performs a state
# or judges a gate. A judge's grant must be read-only and its adapter must
# enforce grants. Modelled on orbelle/satelle's bindings.

# The interactive session codes and runs tasks; nothing is dispatched.
[agents.executor]
command = "session"

# Dispatched planner: Fable 5.2 on the claude CLI; reads the repo and hands
# back a `plan` artifact.
[agents.planner]
command = "claude"
model = "claude-fable-5-2"
effort = "high"
tools = ["Read", "Grep", "Glob", "Bash(satelle story attach:*)", "Bash(satelle story get:*)"]

# The gates' judge: Gemini 3.8 flash on Cursor's own CLI (effort lives in the
# model id; read-only grant runs ask mode with every shell command denied).
[agents.reviewer-alt]
command = "cursor-agent"
model = "gemini-3.8-flash-low"
tools = ["Read", "Grep", "Glob"]

# Second plan judge: both must accept a plan.
[agents.reviewer-grok]
command = "grok"
tools = ["Read", "Grep", "Glob"]
