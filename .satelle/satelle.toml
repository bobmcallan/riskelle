# This repo's satelle settings (kernel schema). An unknown key refuses to run;
# `satelle validate` lists every problem. Modelled on orbelle/satelle's own.

[workflows]
default = "delivery"

# First match wins.
[[workflows.rule]]
workflow = "runbook"
kind = "execution"

[[workflows.rule]]
workflow = "standing"
kind = "task"

[[workflows.rule]]
workflow = "epic"
tag = "epic"

[[workflows.rule]]
workflow = "chore"
category = "chore"

[gate]
# Always editable without a seat: this process config and the harness wiring.
edit_exempt_paths = [".satelle/**", ".claude/**", ".grok/**", ".pi/**", ".gitignore"]

[hook]
# Printed at session start.
inject = [".satelle/constitution.md"]

[rules]
reviewer_differs_from_performer = true
